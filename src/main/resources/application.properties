spring.application.name=asset_tracker

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/asset_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:asset_tracker_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:asset_tracker_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${APP_JWT_SECRET:asset_tracker_secret_key_change_me}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}
